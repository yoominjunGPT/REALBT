<style>
:root{--bg:#000;--bg2:#1c1c1e;--bg3:#2c2c2e;--bg4:#3a3a3c;--line:rgba(84,84,88,.5);--tx:#fff;--tx2:rgba(235,235,245,.62);--tx3:rgba(235,235,245,.32);--ac:#fa243c;--ac2:#fb5c74;--grad:linear-gradient(135deg,#fa233b,#fb5c74);--ok:#32d74b;--err:#ff453a;--r:14px;--sb:224px;--sat:env(safe-area-inset-top);--sab:env(safe-area-inset-bottom)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",Roboto,sans-serif;font-size:15px;line-height:1.4;overflow:hidden;overscroll-behavior:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
.hidden{display:none!important}
.ic{width:24px;height:24px;fill:currentColor;flex:none;display:inline-block;vertical-align:middle}
.ic.big{width:40px;height:40px}.ic.sm{width:18px;height:18px}
h1{font-size:28px;margin:0 0 16px;letter-spacing:-.02em}
h2{font-size:20px;margin:0;letter-spacing:-.01em}
.logo{font-weight:800;letter-spacing:.08em;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
#boot{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:200;font-size:34px}
#boot .logo{animation:pulse 1.4s infinite ease-in-out}
@keyframes pulse{50%{opacity:.4}}
/* layout */
#app{display:grid;height:100dvh;grid-template-columns:var(--sb) minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto}
#side{grid-row:1;background:#000;padding:calc(20px + var(--sat)) 12px 12px;display:flex;flex-direction:column;gap:4px;overflow-y:auto;border-right:1px solid var(--line)}
#side .logo{font-size:24px;padding:0 12px 16px}
.nv{display:flex;align-items:center;gap:14px;padding:11px 12px;border-radius:10px;color:var(--tx2);font-weight:600;width:100%;text-align:left;transition:.15s}
.nv:hover{color:var(--tx);background:var(--bg3)}
.nv.on{color:var(--tx);background:var(--bg4)}
.nv.on .ic{color:var(--ac)}
.sbpl{margin-top:12px;border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:2px;min-height:0}
.sbpl .nv{font-weight:500;padding:8px 12px;font-size:14px}
.sbpl .nv span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#main{grid-row:1;grid-column:2;overflow-y:auto;overflow-x:hidden;min-width:0;background:linear-gradient(180deg,#17131f 0,var(--bg) 320px);-webkit-overflow-scrolling:touch;padding-top:var(--sat)}
.pg{padding:28px 28px 40px;max-width:1200px;margin:0 auto}
#player{grid-column:1/-1;grid-row:2;background:rgba(14,14,18,.96);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr) minmax(0,1fr);align-items:center;gap:12px;padding:10px 16px calc(10px + var(--sab));position:relative;z-index:20}
.pinfo{display:flex;align-items:center;gap:12px;min-width:0;cursor:pointer}
.pinfo .cv{width:56px;height:56px;border-radius:8px;flex:none}
.pinfo .tx{min-width:0}
.pt{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ps{color:var(--tx2);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pmid{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.ctl{display:flex;align-items:center;gap:10px}
.ib{width:38px;height:38px;border-radius:50%;display:inline-grid;place-items:center;color:var(--tx2);transition:.15s;flex:none}
.ib:hover{color:var(--tx);background:rgba(255,255,255,.07)}
.ib.on{color:var(--ac)}
.ib.liked{color:var(--ac2)}
.pp{width:44px;height:44px;border-radius:50%;background:var(--tx);color:#000;display:grid;place-items:center;transition:.15s;flex:none}
.pp:hover{transform:scale(1.07)}
.pp.lg{width:68px;height:68px}.pp.lg .ic{width:34px;height:34px}
.seekrow{display:flex;align-items:center;gap:10px;width:100%;max-width:640px;color:var(--tx2);font-size:12px;font-variant-numeric:tabular-nums}
.seekrow .tm{width:40px;text-align:center}
.pright{display:flex;align-items:center;justify-content:flex-end;gap:4px}
.vol{width:96px}
.rg{-webkit-appearance:none;appearance:none;background:transparent;height:24px;width:100%;margin:0;cursor:pointer;--p:0%}
.rg::-webkit-slider-runnable-track{height:4px;border-radius:4px;background:linear-gradient(to right,#fff var(--p),var(--bg4) var(--p))}
.rg::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;margin-top:-5px;border-radius:50%;background:#fff;opacity:0;transition:.15s}
.rg:hover::-webkit-slider-thumb,.rg:active::-webkit-slider-thumb{opacity:1}
.rg::-moz-range-track{height:4px;border-radius:4px;background:var(--bg4)}
.rg::-moz-range-progress{height:4px;border-radius:4px;background:#fff}
.rg::-moz-range-thumb{width:12px;height:12px;border:0;border-radius:50%;background:#fff}
@media(hover:none){.rg::-webkit-slider-thumb{opacity:1}}
.mprog{display:none;position:absolute;left:0;right:0;top:-1px;height:2px;background:var(--bg4)}
.mprog i{display:block;height:100%;width:0;background:var(--grad)}
#bnav{display:none}
/* generic */
.cv{object-fit:cover;aspect-ratio:1;background:var(--bg3);display:block;width:100%;border-radius:10px;-webkit-user-drag:none;user-select:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;border-radius:999px;background:var(--bg4);font-weight:600;transition:.15s;white-space:nowrap}
.btn:hover{background:#34344a}
.btn.pri{background:var(--grad);color:#fff}
.btn.pri:hover{filter:brightness(1.1)}
.btn.dng{color:var(--err)}
.btn.sm{padding:7px 12px;font-size:13px}
.btn:disabled{opacity:.45;pointer-events:none}
.chip{padding:7px 14px;border-radius:999px;background:var(--bg3);color:var(--tx2);font-weight:600;font-size:14px;white-space:nowrap}
.chip.on{background:var(--tx);color:#000}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
input[type=text],input[type=email],input[type=password],input[type=search],select,textarea{width:100%;background:var(--bg3);border:1px solid var(--line);border-radius:10px;padding:11px 14px;outline:none;transition:.15s}
input:focus,select:focus,textarea:focus{border-color:var(--ac)}
select{appearance:none;-webkit-appearance:none;padding-right:30px;background-image:linear-gradient(45deg,transparent 50%,#a3a3b5 50%),linear-gradient(135deg,#a3a3b5 50%,transparent 50%);background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px;background-repeat:no-repeat}
label.f{display:block;font-size:12px;color:var(--tx2);margin:0 0 4px}
.sec{margin:28px 0 0}
.sech{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
.more{color:var(--tx2);font-size:13px;font-weight:600}.more:hover{color:var(--tx)}
.hs{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(138px,164px);gap:16px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none;scroll-snap-type:x proximity}
.hs::-webkit-scrollbar{display:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:18px}
.card{position:relative;padding:10px;border-radius:12px;background:var(--bg2);cursor:pointer;transition:.2s;min-width:0;scroll-snap-align:start}
.card:hover{background:var(--bg3);transform:translateY(-2px)}
.card .cvw{position:relative}
.card .fab{position:absolute;right:8px;bottom:8px;width:42px;height:42px;border-radius:50%;background:var(--grad);display:grid;place-items:center;opacity:0;transform:translateY(8px);transition:.2s;box-shadow:0 6px 16px rgba(0,0,0,.5)}
.card:hover .fab{opacity:1;transform:none}
@media(hover:none){.card .fab{opacity:1;transform:none;width:36px;height:36px}}
.card .t{font-weight:600;margin-top:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .s{color:var(--tx2);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row{display:grid;grid-template-columns:48px minmax(0,1fr) minmax(0,.7fr) 44px auto auto;gap:12px;align-items:center;padding:6px 8px;border-radius:10px;cursor:pointer;transition:.12s}
.row:hover{background:var(--bg3)}
.row.cur{background:rgba(250,36,60,.12)}
.row.cur .t{color:var(--ac)}
.row.drag{opacity:.4}.row.over{box-shadow:0 -2px 0 var(--ac)}
.row .rc{position:relative;width:48px;height:48px}
.row .rc .cv{border-radius:8px}
.row .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{color:var(--tx2);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .al{color:var(--tx2);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .rd{color:var(--tx2);font-size:13px;font-variant-numeric:tabular-nums;text-align:right}
.eq{position:absolute;inset:0;display:none;align-items:flex-end;justify-content:center;gap:2px;padding:12px;background:rgba(0,0,0,.55);border-radius:8px}
.row.cur .eq{display:flex}
.eq i{width:3px;background:var(--ac);height:30%;border-radius:2px;animation:eq 1s infinite ease-in-out;animation-play-state:paused}
body.playing .eq i{animation-play-state:running}
.eq i:nth-child(2){animation-delay:.2s}.eq i:nth-child(3){animation-delay:.4s}
@keyframes eq{0%,100%{height:25%}50%{height:90%}}
.empty{text-align:center;color:var(--tx2);padding:48px 16px;display:flex;flex-direction:column;align-items:center;gap:14px}
.empty .ic{width:48px;height:48px;color:var(--tx3)}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.search{position:relative;flex:1;min-width:180px}
.search .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--tx3);width:20px;height:20px}
.search input{padding-left:40px;border-radius:999px}
.phead{display:flex;gap:24px;align-items:flex-end;margin-bottom:24px;flex-wrap:wrap}
.pcover{width:min(220px,40vw);flex:none;border-radius:14px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.5);background:var(--bg3);aspect-ratio:1}
.pcover .cv{border-radius:0;height:100%}
.mosaic{display:grid;grid-template-columns:1fr 1fr;height:100%}
.mosaic .cv{border-radius:0;height:100%}
.phead .info{min-width:0;flex:1}
.phead h1{margin:4px 0 6px;word-break:break-word}
.muted{color:var(--tx2);font-size:14px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.card2{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.setg{display:grid;gap:16px;max-width:640px}
.setg .card2 h2{font-size:16px;margin-bottom:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* upload */
.dz{border:2px dashed var(--line);border-radius:var(--r);padding:36px 16px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;transition:.2s;color:var(--tx2);background:var(--bg2)}
.dz:hover,.dz.over{border-color:var(--ac);background:rgba(250,36,60,.08);color:var(--tx)}
.dz b{color:var(--tx)}
.dz .ic{color:var(--ac)}
.uit{display:grid;grid-template-columns:96px minmax(0,1fr);gap:14px;margin-top:12px;padding:14px;background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);position:relative;overflow:hidden}
.uit.done{border-color:rgba(61,220,151,.4)}
.uit.error{border-color:rgba(255,107,107,.5)}
.uit .pv{width:96px}
.uit .pv .cv{width:96px;height:96px}
.uit .fl{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.uit .fl .full{grid-column:1/-1}
.uit .meta{color:var(--tx2);font-size:12px;margin:8px 0;word-break:break-all}
.uit .yt{display:flex;gap:6px;margin-bottom:8px}
.uit .yt input{flex:1;min-width:0;padding:8px 12px;font-size:13px}
.pbar{height:6px;background:var(--bg4);border-radius:6px;overflow:hidden;margin:6px 0}
.pbar i{display:block;height:100%;width:0;background:var(--grad);transition:width .2s}
.st{font-size:13px;color:var(--tx2)}
.uit.error .st{color:var(--err)}.uit.done .st{color:var(--ok)}
.ua{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.upbar{position:sticky;bottom:0;margin-top:16px;padding:12px 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:linear-gradient(0deg,var(--bg) 70%,transparent)}
/* modal */
#modals>.mb{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:80;display:flex;align-items:center;justify-content:center;padding:16px;animation:fade .2s}
.modal{background:var(--bg2);border:1px solid var(--line);border-radius:18px;width:min(520px,100%);max-height:90dvh;overflow-y:auto;padding:22px;animation:pop .2s}
.modal h2{margin-bottom:14px}
.modal .mf{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.menu{display:flex;flex-direction:column;gap:2px}
.menu .nv{padding:13px 12px}
.mhead{display:flex;gap:12px;align-items:center;margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.mhead .cv{width:52px;height:52px}
.edart{display:flex;gap:14px;align-items:flex-start;margin-bottom:14px}
.edart .cv{width:104px;height:104px;flex:none}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.98)}}
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:110px;z-index:120;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(92vw,420px)}
.toast{background:#2c2c3a;border:1px solid var(--line);padding:11px 18px;border-radius:999px;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.5);animation:pop .2s;text-align:center}
.toast.err{background:#3a1f26;border-color:#6b2c38}.toast.ok{background:#173326;border-color:#245c42}
#net{position:fixed;top:0;left:0;right:0;z-index:150;background:#7a2b36;text-align:center;padding:calc(6px + var(--sat)) 12px 6px;font-size:13px}
/* auth */
#auth,#setup{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:16px;background:radial-gradient(circle at 20% 10%,#2a1c4a 0,transparent 45%),radial-gradient(circle at 85% 90%,#4a1c38 0,transparent 45%),var(--bg);overflow-y:auto}
.acard{width:min(400px,100%);background:rgba(18,18,23,.85);border:1px solid var(--line);border-radius:22px;padding:28px 24px;backdrop-filter:blur(10px)}
.acard .logo{font-size:34px;text-align:center;margin-bottom:6px}
.acard p.sub{text-align:center;color:var(--tx2);margin:0 0 20px;font-size:14px}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--bg3);border-radius:999px;padding:4px;margin-bottom:18px}
.tabs button{padding:9px;border-radius:999px;font-weight:600;color:var(--tx2)}
.tabs button.on{background:var(--bg4);color:var(--tx)}
.acard form{display:grid;gap:12px}
.amsg{font-size:13px;padding:10px 12px;border-radius:10px;background:var(--bg3)}
.amsg.err{color:var(--err)}.amsg.ok{color:var(--ok)}
.lnk{color:var(--tx2);font-size:13px;text-align:center;text-decoration:underline}
/* full player */
#full{position:fixed;inset:0;z-index:50;background:linear-gradient(180deg,#2a1c4a 0,#0d0b14 70%);display:flex;flex-direction:column;padding:calc(12px + var(--sat)) 24px calc(20px + var(--sab));transform:translateY(100%);transition:transform .35s cubic-bezier(.2,.8,.2,1);visibility:hidden}
#full.open{transform:none;visibility:visible}
#full .fh{display:flex;align-items:center;justify-content:space-between;color:var(--tx2);font-size:13px;font-weight:600}
#full .fb{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:20px;max-width:520px;width:100%;margin:0 auto}
#full .fart{width:min(100%,46dvh,420px);aspect-ratio:1;flex:none}
#full .fart .cv{border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.6);transition:transform .3s}
body:not(.playing) #full .fart .cv{transform:scale(.92)}
#full .fti{width:100%;display:flex;align-items:center;gap:10px}
#full .fti .tx{flex:1;min-width:0}
#full .fti .pt{font-size:22px}
#full .seekrow{max-width:none}
#full .ctl{gap:14px;justify-content:center}
#full .ctl .ib{width:46px;height:46px}
#full .fv{display:flex;align-items:center;gap:8px;width:100%;color:var(--tx2)}
/* queue */
#qp{position:fixed;top:0;bottom:0;right:0;width:min(380px,100vw);z-index:60;background:var(--bg2);border-left:1px solid var(--line);transform:translateX(100%);transition:transform .3s;display:flex;flex-direction:column;padding-top:var(--sat);visibility:hidden}
#qp.open{transform:none;visibility:visible}
#qp .qh{display:flex;justify-content:space-between;align-items:center;padding:16px 16px 8px}
#qp .ql{overflow-y:auto;padding:0 8px calc(16px + var(--sab));flex:1}
.qi{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center;padding:6px;border-radius:10px;cursor:pointer}
.qi:hover{background:var(--bg3)}.qi.cur{background:rgba(250,36,60,.14)}
.qi .cv{width:44px;height:44px;border-radius:6px}
.qlabel{padding:10px 8px 4px;color:var(--tx3);font-size:12px;font-weight:700;letter-spacing:.06em}
.spin{width:18px;height:18px;border:2px solid var(--line);border-top-color:var(--ac);border-radius:50%;animation:rot .7s linear infinite;display:inline-block}
@keyframes rot{to{transform:rotate(360deg)}}
.loading{display:grid;place-items:center;padding:60px}
/* responsive */
@media(max-width:1023px){:root{--sb:76px}
 #side{padding-left:8px;padding-right:8px;align-items:center}
 #side .logo{font-size:15px;padding:0 0 14px}
 .nv{flex-direction:column;gap:4px;font-size:11px;padding:10px 4px;justify-content:center;text-align:center}
 .sbpl{display:none}
}
@media(max-width:767px){
 #app{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto auto}
 #side{display:none}
 #main{grid-column:1}
 .pg{padding:20px 16px 28px}h1{font-size:24px}
 #player{grid-row:2;grid-template-columns:minmax(0,1fr) auto;padding:8px 12px 8px;border-top:0;border-radius:14px 14px 0 0}
 #player .pmid{display:contents}
 #player .seekrow,#player .hm,#player .pright{display:none}
 #player .ctl{gap:2px}
 .mprog{display:block}
 .pinfo .cv{width:46px;height:46px}
 #bnav{grid-row:3;display:grid;grid-template-columns:repeat(5,1fr);background:#000;border-top:1px solid var(--line);padding:6px 4px calc(6px + var(--sab));z-index:21}
 #bnav .nv{padding:6px 2px;font-size:10.5px;gap:2px;border-radius:8px}
 .row{grid-template-columns:48px minmax(0,1fr) auto auto;gap:8px}
 .row .al,.row .rd{display:none}
 .modal{align-self:flex-end;border-radius:20px 20px 0 0;padding-bottom:calc(22px + var(--sab))}
 #modals>.mb{align-items:flex-end;padding:0}
 .modal{width:100%}
 #toasts{bottom:calc(150px + var(--sab))}
 .uit{grid-template-columns:72px minmax(0,1fr)}.uit .pv,.uit .pv .cv{width:72px;height:72px}
 .phead{flex-direction:column;align-items:flex-start;gap:14px}
 .pcover{width:min(200px,60vw)}
 .two{grid-template-columns:1fr}
}
@media(max-width:380px){.uit .fl{grid-template-columns:1fr}}
@media(min-width:768px) and (max-width:1023px){.row{grid-template-columns:48px minmax(0,1fr) minmax(0,.6fr) 44px auto auto}}

/* ===== Apple Music / iOS style overrides ===== */
html,body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Apple SD Gothic Neo","Noto Sans KR",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
h1{font-size:34px;font-weight:700;letter-spacing:-.03em;margin-bottom:18px}
h2{font-size:22px;font-weight:700;letter-spacing:-.02em}
#main{background:var(--bg)}
#side{background:rgba(28,28,30,.72);-webkit-backdrop-filter:saturate(180%) blur(30px);backdrop-filter:saturate(180%) blur(30px);border-right:.5px solid var(--line)}
.nv{border-radius:10px;font-weight:500;color:var(--tx)}
.nv .ic{color:var(--ac)}
.nv:hover{background:rgba(255,255,255,.06)}
.nv.on{background:rgba(250,36,60,.16);color:var(--ac)}
.sbpl{border-top:.5px solid var(--line)}
.sbpl .nv{color:var(--tx2)}
#player{background:rgba(36,36,38,.74);-webkit-backdrop-filter:saturate(180%) blur(30px);backdrop-filter:saturate(180%) blur(30px);border-top:.5px solid var(--line)}
.pp{background:transparent;color:var(--tx);width:44px;height:44px}
.pp .ic{width:30px;height:30px}
.pp:hover{transform:none}.pp:active{transform:scale(.9)}
.pp.lg{background:transparent;width:76px;height:76px}.pp.lg .ic{width:56px;height:56px}
.ib.on{color:var(--ac);background:rgba(250,36,60,.14)}
.ib.liked{color:var(--ac)}
.cv{border-radius:8px;box-shadow:0 1px 6px rgba(0,0,0,.45)}
.mosaic .cv,.pcover .cv{border-radius:0;box-shadow:none}
.card{background:transparent;padding:0;border-radius:0}
.card:hover{background:transparent;transform:none}
.card:active{opacity:.7}
.card .cv{border-radius:10px}
.card .t{font-weight:500;font-size:15px;margin-top:8px}
.card .cvw .pcover{border-radius:10px;box-shadow:0 1px 6px rgba(0,0,0,.45)}
.row{border-radius:0;border-bottom:.5px solid var(--line);padding:8px 4px}
.row:last-child{border-bottom:0}
.row:hover{background:rgba(255,255,255,.04)}
.row.cur{background:rgba(250,36,60,.1)}
.row .rc .cv,.eq{border-radius:6px}
.row .t{font-weight:500}
.btn{background:rgba(250,36,60,.15);color:var(--ac);border-radius:12px;font-weight:600}
.btn:hover{background:rgba(250,36,60,.24)}
.btn.pri{background:var(--ac);color:#fff}
.btn.pri:hover{background:var(--ac);filter:brightness(1.08)}
.btn.dng{color:var(--err);background:rgba(255,69,58,.14)}
.btn:active,.ib:active,.nv:active{transform:scale(.96);opacity:.8}
.chip{background:var(--bg3);color:var(--tx);font-weight:500}
.chip.on{background:var(--ac);color:#fff}
input[type=text],input[type=email],input[type=password],input[type=search],select,textarea{background:var(--bg3);border:0;border-radius:12px;padding:12px 14px}
input:focus,select:focus,textarea:focus{box-shadow:0 0 0 2px rgba(250,36,60,.55)}
.search input{border-radius:12px}
.card2,.uit{background:var(--bg2);border:0;border-radius:14px}
.dz{border-radius:14px;background:var(--bg2)}
.modal{background:rgba(44,44,46,.9);-webkit-backdrop-filter:saturate(180%) blur(30px);backdrop-filter:saturate(180%) blur(30px);border:0;border-radius:16px}
#modals>.mb{background:rgba(0,0,0,.45)}
#full{background:linear-gradient(180deg,#4a1822 0,#1a0a0e 55%,#000 100%)}
#full .fart .cv{border-radius:12px}
#auth,#setup{background:radial-gradient(circle at 20% 0,rgba(250,36,60,.3) 0,transparent 50%),radial-gradient(circle at 90% 100%,rgba(251,92,116,.2) 0,transparent 50%),#000}
.acard{background:rgba(28,28,30,.82);border:0;border-radius:22px;-webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px)}
.acard .logo{margin-bottom:22px}
.tabs{border-radius:10px;padding:2px}
.tabs button{border-radius:8px;padding:8px;color:var(--tx2)}
.tabs button.on{background:var(--bg4);color:var(--tx)}
.toast{background:rgba(58,58,60,.92);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border:0;border-radius:14px}
.toast.err{background:rgba(120,30,30,.94)}.toast.ok{background:rgba(24,80,40,.94)}
#qp{background:rgba(28,28,30,.92);-webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px);border-left:.5px solid var(--line)}
.qi.cur{background:rgba(250,36,60,.14)}
@media(max-width:767px){
 .modal{border-radius:14px 14px 0 0}
 .modal::before{content:"";display:block;width:36px;height:5px;border-radius:3px;background:rgba(235,235,245,.3);margin:-10px auto 14px}
 #bnav{background:rgba(28,28,30,.78);-webkit-backdrop-filter:saturate(180%) blur(30px);backdrop-filter:saturate(180%) blur(30px);border-top:.5px solid var(--line)}
 #bnav .nv{color:var(--tx3);background:none}
 #bnav .nv.on{color:var(--ac);background:none}
 #bnav .nv .ic{color:inherit}
 #player{border-radius:0}
}

/* ===== 사용자 요청 오버라이드 ===== */
/* 프로그램 이름: 흰색 */
.logo{background:none!important;-webkit-background-clip:border-box!important;background-clip:border-box!important;color:#fff!important;-webkit-text-fill-color:#fff!important}
/* 빨간 바탕 버튼 글씨: 흰색 */
.btn,.btn:hover,.btn.pri,.btn.dng,.chip.on,.nv.on,.tabs button.on.red,.card .fab{color:#fff!important}
.btn .ic,.btn.pri .ic,.btn.dng .ic,.chip.on .ic,.nv.on .ic{color:#fff!important;fill:#fff!important}
.btn.dng{background:rgba(255,69,58,.55)}
.btn:not(.pri):not(.dng){background:rgba(250,36,60,.55)}
/* 확대/축소 및 좌우 스크롤 제한, 상하 스크롤은 부드럽게 */
html,body{overflow-x:hidden!important;max-width:100vw;overscroll-behavior:none!important;-webkit-text-size-adjust:100%;text-size-adjust:100%}
#app,#main,#side{overflow-x:hidden!important;max-width:100%}
#main,#side,#qp .ql,.modal{overscroll-behavior:contain;scroll-behavior:smooth;-webkit-overflow-scrolling:touch}
#main{touch-action:pan-y;overscroll-behavior-y:none}
.hs,.chips{touch-action:pan-x pan-y;overscroll-behavior-x:contain}

/* ===== 전체 라이트 모드 ===== */
:root{color-scheme:light;--bg:#fff;--bg2:#f2f2f7;--bg3:#e9e9ee;--bg4:#d8d8de;--line:rgba(60,60,67,.18);--tx:#000;--tx2:rgba(60,60,67,.72);--tx3:rgba(60,60,67,.42);--err:#d70015;--ok:#1f9d3a}
html,body,#main,#boot{background:#fff;color:#000}
.logo{color:#000!important;-webkit-text-fill-color:#000!important}
#side{background:rgba(247,247,250,.9)!important}
#player{background:rgba(255,255,255,.86)!important}
#bnav{background:rgba(255,255,255,.9)!important}
#qp{background:rgba(255,255,255,.97)!important}
#full{background:linear-gradient(180deg,#ffe1e5 0,#fff 70%)!important}
#auth,#setup{background:radial-gradient(circle at 20% 0,rgba(250,36,60,.14) 0,transparent 50%),radial-gradient(circle at 90% 100%,rgba(251,92,116,.12) 0,transparent 50%),#fff!important}
.acard{background:rgba(255,255,255,.92)!important;box-shadow:0 8px 30px rgba(0,0,0,.08)}
.modal{background:rgba(255,255,255,.96)!important;box-shadow:0 10px 40px rgba(0,0,0,.18)}
.modal::before{background:rgba(60,60,67,.3)!important}
#modals>.mb{background:rgba(0,0,0,.3)!important}
.toast{background:#fff!important;color:#000;box-shadow:0 6px 24px rgba(0,0,0,.15)!important;border:1px solid var(--line)!important}
.toast.err{background:#fff0f0!important;color:#b00020;border-color:#f3b7bd!important}
.toast.ok{background:#eefaf1!important;color:#146c2e;border-color:#b5e3c2!important}
#net{color:#fff}
.nv:hover,.row:hover,.qi:hover{background:rgba(0,0,0,.05)!important}
.ib:hover{background:rgba(0,0,0,.06)}
.pp,.pp.lg{color:#000}
.rg::-webkit-slider-runnable-track{background:linear-gradient(to right,#1c1c1e var(--p),var(--bg4) var(--p))}
.rg::-webkit-slider-thumb{background:#1c1c1e}
.rg::-moz-range-progress{background:#1c1c1e}.rg::-moz-range-thumb{background:#1c1c1e}
.card .cv,.pinfo .cv,.cv{box-shadow:0 1px 6px rgba(0,0,0,.18)}
/* 빨간 버튼은 라이트 배경에서도 흰 글씨가 잘 보이도록 진한 빨강 */
.btn:not(.pri):not(.dng),.btn:not(.pri):not(.dng):hover{background:var(--ac)!important}
.btn.dng{background:var(--err)!important}
.btn.pri,.chip.on{background:var(--ac)!important}
.tabs button.on{background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.15)}
input[type=text],input[type=email],input[type=password],input[type=search],select,textarea{background:var(--bg2)}

/* ===== 그라데이션 제거 + Apple Music 스타일 ===== */
:root{--grad:#fa243c;--ac:#fa233b;--bg2:#f5f5f7;--bg3:#ececf0;--bg4:#dcdce1;--sbw:240px}
html,body,#main,#boot,#auth,#setup,#full,.upbar{background-image:none!important}
#main,.upbar{background:#fff!important}
#auth,#setup{background:#fff!important}
#full{background:#fff!important}
.acard{background:#fff!important;box-shadow:none!important;border:0!important}
.logo{letter-spacing:-.01em;font-weight:700}

/* 사이드바: 연회색 + 얇은 구분선, 선택 항목은 회색 바탕 + 빨간 아이콘 */
#side{background:#f5f5f7!important;border-right:.5px solid rgba(60,60,67,.2)!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
#side .nv{color:#000;font-weight:500;font-size:15px;border-radius:8px;padding:9px 12px}
#side .nv .ic{color:var(--ac);fill:var(--ac)!important}
#side .nv.on{background:rgba(60,60,67,.12)!important;color:#000!important}
#side .nv.on .ic{color:var(--ac)!important;fill:var(--ac)!important}
#side .nv:hover:not(.on){background:rgba(60,60,67,.07)!important}
.sbpl{border-top:.5px solid rgba(60,60,67,.2)!important}
.sbpl .nv{color:#000!important;font-weight:400!important}

/* 하단 탭바 */
#bnav{background:rgba(249,249,251,.94)!important;border-top:.5px solid rgba(60,60,67,.25)!important;-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px)}
#bnav .nv{color:rgba(60,60,67,.6)!important}
#bnav .nv .ic{color:inherit!important;fill:currentColor!important}
#bnav .nv.on,#bnav .nv.on .ic{color:var(--ac)!important;fill:var(--ac)!important;background:none!important}

/* 플레이어 */
#player{background:rgba(246,246,248,.94)!important;border-top:.5px solid rgba(60,60,67,.25)!important}
.pinfo .cv{border-radius:6px}
.pt{font-weight:500}
.ps{color:var(--tx2)}
.pp,.pp.lg{color:#000;background:transparent}
.seekrow{color:var(--tx3);font-size:11px}
.rg::-webkit-slider-runnable-track{height:3px;background:linear-gradient(to right,#8e8e93 var(--p),#d1d1d6 var(--p))}
.rg::-webkit-slider-thumb{width:12px;height:12px;margin-top:-4.5px;background:#8e8e93}
.rg::-moz-range-progress{background:#8e8e93}.rg::-moz-range-thumb{background:#8e8e93}
.mprog i,.pbar i{background:var(--ac)!important}

/* 제목/섹션 */
h1{font-size:34px;font-weight:700;letter-spacing:-.03em}
h2{font-size:22px;font-weight:700}
.more{color:var(--ac)!important;font-weight:400;font-size:15px}

/* 카드/목록 */
.card{background:transparent!important}
.card:hover{background:transparent!important;transform:none!important}
.card .cv,.card .cvw .pcover{border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.card .t{font-size:14px;font-weight:400;margin-top:8px}
.card .s{font-size:13px}
.card .fab{background:var(--ac)!important;box-shadow:0 2px 8px rgba(0,0,0,.25)!important}
.row{border-bottom:.5px solid rgba(60,60,67,.18)!important;padding:8px 4px}
.row .rc .cv,.cv{border-radius:5px}
.row.cur{background:rgba(250,36,60,.08)!important}
.row.cur .t{color:var(--ac)}
.pcover{border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.18)}

/* 버튼: 기본은 연회색 바탕 + 빨간 글씨, 주요 버튼은 빨간 바탕 + 흰 글씨 */
.btn{border-radius:10px;font-weight:600}
.btn:not(.pri):not(.dng),.btn:not(.pri):not(.dng):hover{background:#ececf0!important;color:var(--ac)!important}
.btn:not(.pri):not(.dng) .ic{color:var(--ac)!important;fill:var(--ac)!important}
.btn.dng,.btn.dng:hover{background:#ececf0!important;color:var(--err)!important}
.btn.dng .ic{color:var(--err)!important;fill:var(--err)!important}
.btn.pri,.btn.pri:hover{background:var(--ac)!important;color:#fff!important}
.btn.pri .ic{color:#fff!important;fill:#fff!important}
.chip{background:#ececf0;color:#000;font-weight:500}
.chip.on{background:var(--ac)!important;color:#fff!important}

/* 입력/카드/탭 */
input[type=text],input[type=email],input[type=password],input[type=search],select,textarea{background:#ececf0!important;border:0!important;border-radius:10px}
.card2,.uit{background:#f5f5f7!important;border:0!important;border-radius:12px}
.dz{background:#f5f5f7!important;border:1.5px dashed rgba(60,60,67,.3)!important;border-radius:12px}
.tabs{background:#ececf0!important}
.tabs button.on{background:#fff!important}

/* 전체화면 플레이어 / 대기열 */
#full .fart .cv{box-shadow:0 12px 40px rgba(0,0,0,.25);border-radius:10px}
#qp{background:#fff!important;border-left:.5px solid rgba(60,60,67,.2)!important}
.qi.cur{background:rgba(250,36,60,.08)!important}

/* 모바일: 둥근 미니 플레이어가 탭바 위에 떠 있는 형태 */
@media(max-width:767px){
 #player{margin:0 8px 6px;border-radius:14px!important;border:0!important;background:rgba(240,240,244,.97)!important;box-shadow:0 2px 14px rgba(0,0,0,.14)}
 #bnav{border-top:.5px solid rgba(60,60,67,.25)!important}
}

/* ===== 로그인 창: 배경/카드/탭 구분 ===== */
#auth,#setup{background:#e9e9ef!important}
.acard{background:#fff!important;border:.5px solid rgba(60,60,67,.18)!important;box-shadow:0 10px 40px rgba(0,0,0,.12)!important;border-radius:20px}
.acard .tabs{background:#e3e3e8!important;border-radius:10px;padding:3px}
.acard .tabs button{color:rgba(60,60,67,.65)!important;font-weight:500;border-radius:8px;padding:9px}
.acard .tabs button.on{background:#fff!important;color:#000!important;font-weight:700;box-shadow:0 1px 4px rgba(0,0,0,.2),0 0 0 .5px rgba(60,60,67,.12)}
.acard input[type=text],.acard input[type=email],.acard input[type=password]{background:#f2f2f7!important;border:.5px solid rgba(60,60,67,.18)!important}

/* ===== 상하 스크롤: 딱딱한 차단(none) 제거 -> 부드러운 탄성 제한 ===== */
html,body{overscroll-behavior-y:contain!important;overscroll-behavior-x:none!important}
#main,#side,#qp .ql,.modal{overscroll-behavior-y:contain!important;overscroll-behavior-x:none!important;scroll-behavior:smooth;-webkit-overflow-scrolling:touch}
#main{touch-action:pan-y}

/* ===== 내용이 짧아도 부드러운 탄성 제한 (터치 기기) ===== */
@media(hover:none){#main>.pg{min-height:calc(100% + 1px)}}
#main,.modal,#qp .ql{will-change:transform}
</style>

'use strict';
/* =====================================================================
   REALBT — 개인용 음악 스트리밍 웹앱 (단일 파일)
   Supabase 연결 정보: 아래 BUILD_CFG를 직접 채우거나, 비워 두면 첫 실행 시 입력 화면이 나타납니다.
   anon / publishable 키만 사용하세요. service_role 키는 절대 넣지 않습니다.
   ===================================================================== */
const BUILD_CFG={url:'__SUPABASE_URL__',key:'__SUPABASE_ANON_KEY__'};
const BUCKET='realbt', MAX_MB=50, MAX_BYTES=MAX_MB*1024*1024, SIGN_SEC=6*3600;

/* ---------- helpers ---------- */

 const need=uniq(paths.filter(Boolean)).filter(p=>!ART[p]||ART[p].exp-Date.now()<600000);
 for(let i=0;i<need.length;i+=100){const chunk=need.slice(i,i+100);
  try{const {data,error}=await sb.storage.from(BUCKET).createSignedUrls(chunk,SIGN_SEC);if(error)throw error;
   (data||[]).forEach(r=>{if(r.signedUrl)ART[r.path]={url:r.signedUrl,exp:Date.now()+SIGN_SEC*1000}})}catch(e){console.warn('sign art',e)}}}

/* =====================================================================
   Setup / Auth
   ===================================================================== */
function showSetup(msg){
 $('#boot').classList.add('hidden');$('#auth').classList.add('hidden');$('#app').classList.add('hidden');
 const el=$('#setup');el.classList.remove('hidden');
 el.innerHTML=`<div class="acard"><div class="logo">REALBT</div>
 ${msg?`<div class="amsg err" style="margin-bottom:12px">${esc(msg)}</div>`:''}
 <form data-form="setup"><div><label class="f">URL</label><input type="text" name="url" placeholder="https://xxxx.supabase.co" autocomplete="off" required></div>
 <div><label class="f">KEY</label><input type="text" name="key" placeholder="eyJ... 또는 sb_publishable_..." autocomplete="off" required></div>
 
 <button class="btn pri" type="submit">연결하고 시작</button></form></div>`;
}
let authMode='login';
function showAuth(mode,msg,type='err'){
 if(mode)authMode=mode;
 $('#boot').classList.add('hidden');$('#app').classList.add('hidden');$('#setup').classList.add('hidden');
 const el=$('#auth');el.classList.remove('hidden');
 const reset=authMode==='reset',recover=authMode==='recover';
 el.innerHTML=`<div class="acard"><div class="logo">REALBT</div>
 ${(reset||recover)?'':`<div class="tabs"><button type="button" class="${authMode==='login'?'on':''}" data-a="authtab" data-m="login">로그인</button><button type="button" class="${authMode==='signup'?'on':''}" data-a="authtab" data-m="signup">회원가입</button></div>`}
 ${msg?`<div class="amsg ${type}" style="margin-bottom:12px">${esc(msg)}</div>`:''}
 <form data-form="auth">
  ${recover?'':`<div><label class="f">이메일</label><input type="email" name="email" autocomplete="email" required></div>`}
  ${reset?'':`<div><label class="f">${recover?'새 비밀번호':'비밀번호'}</label><input type="password" name="password" minlength="6" autocomplete="${authMode==='login'?'current-password':'new-password'}" required></div>`}
  <button class="btn pri" type="submit">${recover?'비밀번호 변경':reset?'재설정 메일 보내기':authMode==='login'?'로그인':'회원가입'}</button>
  ${authMode==='login'?`<a class="lnk" href="#" data-a="authtab" data-m="reset">비밀번호를 잊으셨나요?</a>`:''}
  ${reset?`<a class="lnk" href="#" data-a="authtab" data-m="login">로그인으로 돌아가기</a>`:''}
 </form>${cfgFromLocal?`<p class="lnk" style="margin:14px 0 0"><a href="#" data-a="resetcfg" style="color:inherit">연결 정보 변경</a></p>`:''}</div>`;
}
function authMsg(e){const m=(e?.message||'').toLowerCase();
 if(isNet(e))return'네트워크 오류: 연결을 확인해 주세요.';
 if(m.includes('invalid login'))return'이메일 또는 비밀번호가 올바르지 않습니다.';
 if(m.includes('not confirmed'))return'이메일 인증을 완료한 뒤 로그인해 주세요.';
 if(m.includes('already registered')||m.includes('already been registered'))return'이미 가입된 이메일입니다.';
 if(m.includes('at least'))return'비밀번호는 6자 이상이어야 합니다.';
 if(m.includes('rate limit')||m.includes('too many'))return'요청이 너무 많습니다. 잠시 후 다시 시도해 주세요.';
 if(m.includes('valid email')||m.includes('invalid email'))return'올바른 이메일을 입력해 주세요.';
 if(m.includes('same password')||m.includes('different from the old'))return'이전과 다른 비밀번호를 사용해 주세요.';
 return e?.message||'오류가 발생했습니다.'}
const FORMS={
 async setup(f){const url=normUrl(f.url.value),key=f.key.value.trim();
  if(!/^https:\/\/.+/.test(url))return showSetup('Project URL 형식을 확인해 주세요.');
  if(keyIsSecret(key))return showSetup('service_role / secret 키는 사용할 수 없습니다. anon(publishable) 키를 입력해 주세요.');
  store.set('realbt.cfg',{url,key});location.reload()},
 async auth(f){const btn=$('button[type=submit]',f);btn.disabled=true;
  try{
   if(authMode==='login'){const {error}=await sb.auth.signInWithPassword({email:f.email.value.trim(),password:f.password.value});if(error)throw error}
   else if(authMode==='signup'){const {data,error}=await sb.auth.signUp({email:f.email.value.trim(),password:f.password.value,options:{emailRedirectTo:location.origin+location.pathname}});if(error)throw error;
    if(!data.session){authMode='login';showAuth('login','확인 메일을 보냈습니다. 메일의 링크를 누른 뒤 로그인해 주세요.','ok')}}
   else if(authMode==='reset'){const {error}=await sb.auth.resetPasswordForEmail(f.email.value.trim(),{redirectTo:location.origin+location.pathname});if(error)throw error;showAuth('login','재설정 메일을 보냈습니다. 메일함을 확인해 주세요.','ok')}
   else if(authMode==='recover'){const {error}=await sb.auth.updateUser({password:f.password.value});if(error)throw error;toast('비밀번호가 변경되었습니다','ok');history.replaceState(null,'',location.pathname);const {data:{session}}=await sb.auth.getSession();S.user=null;await onSession(session)}
  }catch(e){showAuth(null,authMsg(e),'err')}
 }
};
document.addEventListener('submit',e=>{const f=e.target.closest('[data-form]');if(!f)return;e.preventDefault();FORMS[f.dataset.form]?.(f)});

/* =====================================================================
   Boot & session
   ===================================================================== */
async function boot(){
 initPWA();
 window.addEventListener('online',()=>{$('#net').classList.add('hidden');if(S.user)reloadData(true)});
 window.addEventListener('offline',()=>$('#net').classList.remove('hidden'));
 if(!navigator.onLine)$('#net').classList.remove('hidden');
 if(!window.supabase){$('#boot').innerHTML='<div style="font-size:15px;text-align:center;padding:24px;color:#6e6e80">Supabase SDK를 불러오지 못했습니다.<br>네트워크를 확인하고 새로고침해 주세요.</div>';return}
 if(!CFG.url||!CFG.key)return showSetup();
 if(keyIsSecret(CFG.key))return showSetup('service_role / secret 키가 감지되어 사용할 수 없습니다. anon(publishable) 키로 교체해 주세요.');
 sb=supabase.createClient(CFG.url,CFG.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
 sb.auth.onAuthStateChange((ev,session)=>{
  if(ev==='PASSWORD_RECOVERY'){setTimeout(()=>showAuth('recover'),0);return}
  if(ev==='TOKEN_REFRESHED')return;
  setTimeout(()=>onSession(session),0)});
 try{const {data:{session}}=await sb.auth.getSession();await onSession(session)}catch(e){showAuth('login',authMsg(e))}
}
async function onSession(session){
 if(authMode==='recover'&&!$('#auth').classList.contains('hidden')&&session)return;
 if(!session){S.user=null;S.loaded=false;stopPlayback(true);teardownRealtime();$('#app').classList.add('hidden');$('#boot').classList.add('hidden');if($('#auth').classList.contains('hidden')||authMode==='recover'){authMode='login';showAuth('login')}return}
 if(S.user&&S.user.id===session.user.id){S.user=session.user;return}
 S.user=session.user;
 $('#auth').classList.add('hidden');$('#setup').classList.add('hidden');
 buildShell();$('#app').classList.remove('hidden');
 $('#main').innerHTML='<div class="loading"><span class="spin"></span></div>';
 $('#boot').classList.add('hidden');
 await reloadData();
 S.loaded=true;
 parseHash();render();restoreLast();setupRealtime();
}
async function reloadData(soft){
 try{
  const uid=S.user.id;
  const [songs,favs,pls,pss,hist]=await Promise.all([
   fetchAll('songs','created_at',false),
   fetchAll('favorites','created_at',false,'song_id,created_at'),
   fetchAll('playlists','created_at',true),
   fetchAll('playlist_songs','position',true),
   dbq(sb.from('listening_history').select('id,song_id,played_at,playback_position').order('played_at',{ascending:false}).limit(300))]);
  S.songs=songs;S.byId=new Map(songs.map(s=>[s.id,s]));S.favs=new Set(favs.map(f=>f.song_id));S.playlists=pls;S.pls=pss;S.history=hist;
  S.lastPlayed=new Map();hist.forEach(h=>{if(!S.lastPlayed.has(h.song_id))S.lastPlayed.set(h.song_id,h.played_at)});
  if(!S.profile||S.profile.id!==uid){let p=await dbq(sb.from('profiles').select('*').eq('id',uid).maybeSingle());
   if(!p){p=await dbq(sb.from('profiles').upsert({id:uid,username:(S.user.email||'user').split('@')[0]}).select().single())}S.profile=p}
  await ensureArt(allArtPaths());
  if(S.loaded||soft){renderSide();softRender();syncUI()}
 }catch(e){fail(e,'데이터를 불러오지 못했습니다');if(!S.loaded)$('#main').innerHTML=`<div class="empty">${ic('music')}<div>데이터를 불러오지 못했습니다.</div><button class="btn" data-a="reload">다시 시도</button></div>`}
}
let rtChan=null,rtTimer=null;
function setupRealtime(){teardownRealtime();
 try{rtChan=sb.channel('realbt-sync');['songs','favorites','playlists','playlist_songs'].forEach(t=>rtChan.on('postgres_changes',{event:'*',schema:'public',table:t},()=>{clearTimeout(rtTimer);rtTimer=setTimeout(()=>reloadData(true),700)}));rtChan.subscribe()}catch(e){console.warn('realtime',e)}}
function teardownRealtime(){try{if(rtChan)sb.removeChannel(rtChan)}catch{}rtChan=null}
document.addEventListener('visibilitychange',()=>{if(document.hidden){flushHist();saveLast()}else if(S.user&&S.loaded){reloadData(true)}});
setInterval(()=>{if(S.user&&S.loaded&&!document.hidden)ensureArt(allArtPaths())},25*60*1000);

async function loadUsage(){
 try{const uid=S.user.id;let total=0,count=0;
  for(const dir of ['audio','art']){let off=0;for(;;){const {data,error}=await sb.storage.from(BUCKET).list(`${uid}/${dir}`,{limit:1000,offset:off});if(error||!data||!data.length)break;data.forEach(f=>{total+=(f.metadata&&f.metadata.size)||0;count++});if(data.length<1000)break;off+=1000}}
  S.usage=total;const t=`사용 중 ${fmtB(total)} · 파일 ${count}개`;
  const a=$('#usage2');if(a){a.textContent=t;const b=$('#usageBar');if(b)b.style.width=Math.min(100,total/1073741824*100)+'%'}
  const i=$('#upInfo');if(i)i.textContent=t}catch(e){const a=$('#usage2');if(a)a.textContent='사용량을 불러오지 못했습니다'}}

function modal(html,opts={}){
 const mb=document.createElement('div');mb.className='mb';mb.innerHTML=`<div class="modal" role="dialog">${html}</div>`;
 if(opts.z)mb.style.zIndex=opts.z;
 mb.addEventListener('mousedown',e=>{if(e.target===mb&&!opts.sticky)close()});
 const close=()=>{mb.remove();opts.onClose&&opts.onClose()};
 mb.close=close;$('#modals').appendChild(mb);
 const f=$('input[type=text],input:not([type])',mb);if(f&&!opts.nofocus)setTimeout(()=>f.focus(),50);
 return mb}
const closeTop=()=>{const l=$('#modals').lastElementChild;if(l)l.close&&l.close()};
function confirmBox(msg,ok='확인',danger=false){return new Promise(res=>{let done=false;const mb=modal(`<h2>${esc(msg)}</h2><div class="mf"><button class="btn" data-m="no">취소</button><button class="btn ${danger?'dng':'pri'}" data-m="yes">${esc(ok)}</button></div>`,{z:95,nofocus:true,onClose:()=>{if(!done){done=true;res(false)}}});
 mb.addEventListener('click',e=>{const b=e.target.closest('[data-m]');if(!b)return;done=true;res(b.dataset.m==='yes');mb.remove()})})}
function askText(title,val='',ok='확인',ph=''){return new Promise(res=>{let done=false;const mb=modal(`<h2>${esc(title)}</h2><input type="text" maxlength="80" value="${esc(val)}" placeholder="${esc(ph)}"><div class="mf"><button class="btn" data-m="no">취소</button><button class="btn pri" data-m="yes">${esc(ok)}</button></div>`,{z:95,onClose:()=>{if(!done){done=true;res(null)}}});

/* =====================================================================
   Player core
   ===================================================================== */
const audio=new Audio();audio.preload='metadata';audio.volume=store.get('realbt.vol',1);audio.muted=false;
function setQueue(ids,start){S.orig=[...ids];const sid=ids[start];
 if(S.shuffle){const rest=ids.filter((_,i)=>i!==start);shuf(rest);S.queue=[sid,...rest];S.qi=0}else{S.queue=[...ids];S.qi=start}}
async function playIds(ids,start=0,shuffle){if(!ids.length)return;if(shuffle!==undefined){S.shuffle=shuffle;store.set('realbt.shuffle',shuffle)}setQueue(ids,start);await playAt(S.qi)}
async function playAt(i,{pos=0,play=true}={}){
 if(i<0||i>=S.queue.length)return;
 flushHist();
 const s=song(S.queue[i]);
 if(!s){S.queue.splice(i,1);return S.queue.length?playAt(Math.min(i,S.queue.length-1)):stopPlayback(true)}
 S.qi=i;const tk=++S.token;S.hrow=null;S.needLoad=false;S.pendingPos=0;
 syncUI();
 try{
  const url=await audioUrl(s);if(tk!==S.token)return;
  audio.src=url;
  if(pos>1)audio.addEventListener('loadedmetadata',()=>{try{audio.currentTime=pos}catch{}},{once:true});
  if(play)await audio.play();
 }catch(e){if(e&&e.name==='AbortError')return;if(e&&e.name==='NotAllowedError'){syncUI();return}fail(e,'재생할 수 없습니다')}
 saveLast()}
function stopPlayback(clear){try{audio.pause();audio.removeAttribute('src');audio.load()}catch{}S.token++;if(clear){S.queue=[];S.orig=[];S.qi=-1;S.hrow=null;S.needLoad=false}syncUI();$('#full').classList.remove('open');$('#qp').classList.remove('open')}
function togglePlay(){const s=cur();if(!s)return;
 if(S.needLoad||!audio.src){playAt(S.qi,{pos:S.pendingPos});return}
 if(audio.paused)audio.play().catch(e=>{if(e.name!=='AbortError')fail(e,'재생할 수 없습니다')});else audio.pause()}
function next(auto){if(!S.queue.length)return;let i=S.qi+1;
 if(i>=S.queue.length){if(S.repeat==='all'){i=0;if(S.shuffle&&S.queue.length>2){const c=S.queue[S.queue.length-1];shuf(S.queue);if(S.queue[0]===c){const j=1+(Math.random()*(S.queue.length-1)|0);[S.queue[0],S.queue[j]]=[S.queue[j],S.queue[0]]}}}
  else{if(auto){audio.pause();try{audio.currentTime=0}catch{}S.hrow&&flushHist(true);S.hrow=null;syncUI()}return}}
 playAt(i)}
function prev(){if(!S.queue.length)return;if(audio.currentTime>3||(S.qi===0&&S.repeat!=='all')){audio.currentTime=0;return}playAt(S.qi===0?S.queue.length-1:S.qi-1)}
function toggleShuffle(){S.shuffle=!S.shuffle;store.set('realbt.shuffle',S.shuffle);const c=S.queue[S.qi];
 if(S.queue.length){if(S.shuffle){const rest=S.queue.filter((_,i)=>i!==S.qi);shuf(rest);S.queue=c?[c,...rest]:rest;S.qi=c?0:-1}else{const base=S.orig.filter(id=>S.byId.has(id));const extra=S.queue.filter(id=>!base.includes(id));S.queue=[...base,...extra];S.qi=Math.max(0,S.queue.indexOf(c))}}
 syncUI();renderQueue()}
function cycleRepeat(){S.repeat=S.repeat==='off'?'all':S.repeat==='all'?'one':'off';store.set('realbt.repeat',S.repeat);syncUI()}
function addToQueue(id,nextUp){if(!S.queue.length){setQueue([id],0);S.needLoad=true;S.pendingPos=0;syncUI();toast('대기열에 추가했어요');return}
 if(nextUp){S.queue.splice(S.qi+1,0,id);S.orig.push(id)}else{S.queue.push(id);S.orig.push(id)}
 toast(nextUp?'다음에 재생합니다':'대기열에 추가했어요');renderQueue()}
audio.addEventListener('timeupdate',()=>{updateProg();throttleSave()});
audio.addEventListener('loadedmetadata',updateProg);
audio.addEventListener('play',()=>{document.body.classList.add('playing');syncPlayIcon();ensureHist();setMediaState()});
audio.addEventListener('pause',()=>{document.body.classList.remove('playing');syncPlayIcon();flushHist();saveLast();setMediaState()});
audio.addEventListener('ended',()=>{if(S.repeat==='one'){S.hrow&&flushHist(true);S.hrow=null;audio.currentTime=0;audio.play().catch(()=>{})}else{flushHist(true);S.hrow=null;next(true)}});
audio.addEventListener('waiting',()=>document.body.classList.add('buffering'));audio.addEventListener('playing',()=>document.body.classList.remove('buffering'));
let errRetry=0;
audio.addEventListener('error',async()=>{const s=cur();if(!s||!audio.src)return;
 if(errRetry<1){errRetry++;try{const t=audio.currentTime;const url=await audioUrl(s,true);audio.src=url;audio.addEventListener('loadedmetadata',()=>{try{audio.currentTime=t}catch{}},{once:true});await audio.play();return}catch{}}
 errRetry=0;toast(navigator.onLine?'재생 중 오류가 발생했습니다':'네트워크 연결을 확인해 주세요','err')});
audio.addEventListener('playing',()=>{errRetry=0});
/* history (listening_history) */
async function ensureHist(){if(S.hrow||S.hbusy)return;const s=cur();if(!s)return;const tk=S.token;S.hbusy=true;
 try{const d=await dbq(sb.from('listening_history').insert({user_id:S.user.id,song_id:s.id,playback_position:audio.currentTime||0}).select('id,song_id,played_at,playback_position').single());
  S.history.unshift(d);S.lastPlayed.set(s.id,d.played_at);if(tk===S.token)S.hrow=d.id}catch(e){console.warn('hist',e)}finally{S.hbusy=false}}
function flushHist(ended){if(!S.hrow||!S.user)return;const id=S.hrow,pos=ended?0:(audio.currentTime||0),now=new Date().toISOString();
 const r=S.history.find(h=>h.id===id);if(r){r.playback_position=pos;r.played_at=now}
 sb.from('listening_history').update({playback_position:pos,played_at:now}).eq('id',id).then(()=>{},()=>{})}
setInterval(()=>{if(!audio.paused&&S.hrow)flushHist()},20000);
let lastSave=0;function throttleSave(){const n=Date.now();if(n-lastSave>4000){lastSave=n;saveLast()}}
function saveLast(){const s=cur();if(!s||!S.user)return;store.set('realbt.last.'+S.user.id,{id:s.id,pos:audio.currentTime||S.pendingPos||0,queue:S.queue.slice(0,500),orig:S.orig.slice(0,500),qi:S.qi,ts:Date.now()})}
window.addEventListener('pagehide',()=>{flushHist();saveLast()});
function restoreLast(){
 if(!S.user||S.queue.length)return;
 const l=store.get('realbt.last.'+S.user.id,null);const h=S.history.find(x=>S.byId.has(x.song_id));
 let sid=null,pos=0,q=null,qi=0,orig=null;
 const hts=h?new Date(h.played_at).getTime():0;
 if(l&&S.byId.has(l.id)&&l.ts>=hts-1000){sid=l.id;pos=l.pos||0;q=(l.queue||[]).filter(id=>S.byId.has(id));qi=q.indexOf(sid);orig=(l.orig||[]).filter(id=>S.byId.has(id))}
 else if(h){sid=h.song_id;pos=h.playback_position||0}
 if(!sid)return;
 if(!q||qi<0){const ids=S.songs.map(s=>s.id);q=ids;qi=ids.indexOf(sid);orig=ids}
 const sg=song(sid);if(sg&&pos>(sg.duration||0)-3)pos=0;
 S.queue=q;S.orig=orig&&orig.length?orig:q.slice();S.qi=qi;S.needLoad=true;S.pendingPos=pos;syncUI();updateProg()}

 $$('[data-pl=shuffle]').forEach(b=>b.classList.toggle('on',S.shuffle));

 $$('[data-pl=volicon] use').forEach(u=>u.setAttribute('href',(audio.muted||audio.volume===0)?'#i-mute':'#i-volume'));
 $$('.vol').forEach(v=>{v.value=audio.muted?0:audio.volume;v.style.setProperty('--p',(audio.muted?0:audio.volume)*100+'%')});
 syncPlayIcon();updateProg();
 $$('.row').forEach(r=>r.classList.toggle('cur',!!s&&r.dataset.id===s.id));
 if($('#qp').classList.contains('open'))renderQueue()}
function updateProg(){
 const s=cur();if(!s)return;
 const dur=isFinite(audio.duration)&&audio.duration>0&&audio.src?audio.duration:(s.duration||0);
 const t=S.needLoad?S.pendingPos:audio.currentTime;
 if(S.seeking)return;
 $$('.seek').forEach(r=>{r.max=dur||1;r.value=t;r.style.setProperty('--p',(dur?t/dur*100:0)+'%')});
 $$('[data-pl=cur]').forEach(e=>e.textContent=fmtT(t));$$('[data-pl=dur]').forEach(e=>e.textContent=fmtT(dur));
 const b=$('#mprogBar');if(b)b.style.width=(dur?t/dur*100:0)+'%';
 if('mediaSession' in navigator&&dur&&!audio.paused&&Math.floor(t)%5===0){try{navigator.mediaSession.setPositionState({duration:dur,position:Math.min(t,dur),playbackRate:audio.playbackRate})}catch{}}}
document.addEventListener('input',e=>{const t=e.target;
 if(t.classList.contains('seek')){S.seeking=true;const dur=+t.max;t.style.setProperty('--p',(dur?t.value/dur*100:0)+'%');$$('[data-pl=cur]').forEach(x=>x.textContent=fmtT(+t.value));$$('.seek').forEach(r=>{if(r!==t){r.value=t.value;r.style.setProperty('--p',t.style.getPropertyValue('--p'))}})}
 else if(t.classList.contains('vol')){audio.muted=false;audio.volume=+t.value;store.set('realbt.vol',audio.volume);syncUI()}
 else if(t.id==='libQ'){S.lib.q=t.value;$('#libList').innerHTML=libListHTML();$('#libCount').textContent=S.lists.lib.length+'곡'}
 else if(t.dataset.f&&t.dataset.k){const o=getT(t.dataset.k);if(o)o[t.dataset.f]=t.value}});
document.addEventListener('change',e=>{const t=e.target;
 if(t.classList.contains('seek')){const v=+t.value;if(S.needLoad){S.pendingPos=v;S.seeking=false;updateProg()}else{audio.currentTime=v;S.seeking=false}}
 else if(t.id==='libSort'){S.lib.sort=t.value;$('#libList').innerHTML=libListHTML()}});
/* media session */
let lastMediaId=null;
function setMedia(s){if(!('mediaSession' in navigator)||lastMediaId===s.id+artSrc(s))return;lastMediaId=s.id+artSrc(s);
 try{const src=s.artwork_path&&ART[s.artwork_path]?ART[s.artwork_path].url:null;
  navigator.mediaSession.metadata=new MediaMetadata({title:s.title,artist:s.artist||'',album:s.album||'REALBT',artwork:src?[{src,sizes:'600x600',type:'image/jpeg'}]:[]});
  const h={play:()=>togglePlay(),pause:()=>audio.pause(),previoustrack:prev,nexttrack:()=>next(false),seekto:d=>{if(d.seekTime!=null)audio.currentTime=d.seekTime},seekbackward:()=>audio.currentTime=Math.max(0,audio.currentTime-10),seekforward:()=>audio.currentTime+=10};
  Object.entries(h).forEach(([k,f])=>{try{navigator.mediaSession.setActionHandler(k,f)}catch{}})}catch{}}
function setMediaState(){if('mediaSession' in navigator)try{navigator.mediaSession.playbackState=audio.paused?'paused':'playing'}catch{}}
document.addEventListener('keydown',e=>{if(e.code==='Space'&&!/INPUT|TEXTAREA|SELECT|BUTTON/.test(e.target.tagName)&&cur()){e.preventDefault();togglePlay()}else if(e.key==='Escape'){if($('#modals').children.length)closeTop();else if($('#qp').classList.contains('open'))$('#qp').classList.remove('open');else $('#full').classList.remove('open')}});

/* =====================================================================
   Image tools: YouTube thumbnail → square crop, file → square crop
   ===================================================================== */
function ytId(u){u=(u||'').trim();if(/^[\w-]{11}$/.test(u))return u;
 try{const x=new URL(/^https?:/i.test(u)?u:'https://'+u);const h=x.hostname.replace(/^(www|m|music)\./,'');let id='';
  if(h==='youtu.be')id=x.pathname.slice(1).split('/')[0];

   ===================================================================== */
function dec(b,enc){try{
 if(enc===1){let le=true,x=b;if(b[0]===0xFF&&b[1]===0xFE){x=b.subarray(2)}else if(b[0]===0xFE&&b[1]===0xFF){le=false;x=b.subarray(2)}return new TextDecoder(le?'utf-16le':'utf-16be').decode(x)}
 if(enc===2)return new TextDecoder('utf-16be').decode(b);
 if(enc===3)return new TextDecoder('utf-8').decode(b);
 let hi=false;for(let i=0;i<b.length;i++)if(b[i]>=0x80){hi=true;break}
 if(!hi)return new TextDecoder('windows-1252').decode(b);
 try{return new TextDecoder('utf-8',{fatal:true}).decode(b)}catch{}
 try{return new TextDecoder('euc-kr',{fatal:true}).decode(b)}catch{}
 return new TextDecoder('windows-1252').decode(b)}catch{return ''}}
const clean=s=>(s||'').split('\0')[0].replace(/^\uFEFF/,'').trim();
const syncsafe=(b,p)=>((b[p]&127)<<21)|((b[p+1]&127)<<14)|((b[p+2]&127)<<7)|(b[p+3]&127);
function parseAPIC(b,v22){let p=1,mime;
 if(v22){p=4}else{let e=1;while(e<b.length&&b[e]!==0)e++;mime=String.fromCharCode(...b.subarray(1,e));p=e+1}
 p++;const enc=b[0];
 if(enc===1||enc===2){while(p+1<b.length&&!(b[p]===0&&b[p+1]===0))p+=2;p+=2}else{while(p<b.length&&b[p]!==0)p++;p++}

 const type=d[0]===0xFF&&d[1]===0xD8?'image/jpeg':d[0]===0x89&&d[1]===0x50?'image/png':d[0]===0x47&&d[1]===0x49?'image/gif':d[0]===0x52&&d[1]===0x49?'image/webp':(mime&&mime.startsWith('image/')?mime:'image/jpeg');

async function readID3(file){
 const out={};
 try{
  const h=new Uint8Array(await file.slice(0,10).arrayBuffer());
  if(h[0]===0x49&&h[1]===0x44&&h[2]===0x33){
   const ver=h[3],flags=h[5],size=syncsafe(h,6);
   const buf=new Uint8Array(await file.slice(10,10+Math.min(size,20*1024*1024)).arrayBuffer());
   let p=0;if(ver>=3&&(flags&0x40)){const es=ver===4?syncsafe(buf,0):((buf[0]<<24|buf[1]<<16|buf[2]<<8|buf[3])>>>0);p=ver===4?es:es+4}
   const hl=ver===2?6:10,il=ver===2?3:4;
   while(p+hl<=buf.length){
    const id=String.fromCharCode(...buf.subarray(p,p+il));if(!/^[A-Z0-9]+$/.test(id))break;
    let sz;if(ver===2)sz=buf[p+3]<<16|buf[p+4]<<8|buf[p+5];else if(ver===4)sz=syncsafe(buf,p+4);else sz=((buf[p+4]<<24)>>>0)+(buf[p+5]<<16|buf[p+6]<<8|buf[p+7]);
    if(sz<=0||p+hl+sz>buf.length)break;
    const body=buf.subarray(p+hl,p+hl+sz);
    if(id==='TIT2'||id==='TT2')out.title=clean(dec(body.subarray(1),body[0]));
    else if(id==='TPE1'||id==='TP1')out.artist=clean(dec(body.subarray(1),body[0]));
    else if(id==='TALB'||id==='TAL')out.album=clean(dec(body.subarray(1),body[0]));
    else if((id==='APIC'||id==='PIC')&&!out.cover){try{out.cover=parseAPIC(body,ver===2)}catch{}}
    p+=hl+sz}}
  if(!out.title&&file.size>128){const t=new Uint8Array(await file.slice(file.size-128).arrayBuffer());
   if(t[0]===0x54&&t[1]===0x41&&t[2]===0x47){out.title=clean(dec(t.subarray(3,33),0));out.artist=out.artist||clean(dec(t.subarray(33,63),0));out.album=out.album||clean(dec(t.subarray(63,93),0))}}
 }catch(e){console.warn('id3',e)}
 return out}
function measureDuration(file){return new Promise(res=>{const a=new Audio();const u=URL.createObjectURL(file);let done=false;const fin=v=>{if(done)return;done=true;URL.revokeObjectURL(u);a.removeAttribute('src');res(v)};

async function addFiles(files){

 if(S.view.name!=='upload')go('upload');
 let added=0;
 for(const file of list){
  const it={id:uuid(),file,name:file.name,size:file.size,status:'parsing',pct:0,title:'',artist:'',album:'',duration:0,art:null,ytId:null,changed:false,hash:'',msg:'',fallback:()=>placeholder(it.id+it.title)};
  if(!/\.mp3$/i.test(file.name)&&file.type!=='audio/mpeg'){toast(`${file.name}: MP3 파일만 업로드할 수 있어요`,'err');continue}
  if(file.size>MAX_BYTES){toast(`${file.name}: ${MAX_MB}MB를 초과했어요`,'err');continue}
  if(file.size<1024){toast(`${file.name}: 파일이 너무 작아요`,'err');continue}
  S.up.push(it);added++;renderUpList();
  try{
   if(!await hasMp3Header(file))throw new Error('유효한 MP3 파일이 아닙니다');
   const [tags,dur,hash]=await Promise.all([readID3(file),measureDuration(file),fileHash(file)]);
   it.hash=hash;it.duration=dur;
   const base=file.name.replace(/\.mp3$/i,'');let t=tags.title,a=tags.artist;
   if(!t){const m=base.match(/^(.+?)\s+-\s+(.+)$/);if(m){a=a||m[1].trim();t=m[2].trim()}else t=base}
   it.title=t;it.artist=a||'';it.album=tags.album||'';
   if(tags.cover){try{const b=await cropCenter(tags.cover);it.art={blob:b,url:URL.createObjectURL(b)};it.changed=true}catch{}}
   it.path=`${S.user.id}/audio/${hash}.mp3`;
   const dupLib=S.songs.some(s=>s.audio_path===it.path);const dupBatch=S.up.some(x=>x!==it&&x.path===it.path&&x.status!=='removed');
   it.status=dupLib||dupBatch?'dup':'ready';
   if(it.status==='dup')it.msg=dupLib?'이미 보관함에 있는 파일입니다':'목록에 같은 파일이 있습니다';
  }catch(e){it.status='error';it.msg=e.message||'파일을 읽지 못했습니다';it.fatal=true}
  renderUpList()}
}

async function backup(){
 try{const [songs,pl,ps,fav,hist]=await Promise.all([fetchAll('songs','created_at',true),fetchAll('playlists','created_at',true),fetchAll('playlist_songs','position',true),fetchAll('favorites','created_at',true),fetchAll('listening_history','played_at',true)]);
  const data={app:'REALBT',version:1,exported_at:new Date().toISOString(),user_id:S.user.id,songs,playlists:pl,playlist_songs:ps,favorites:fav,listening_history:hist};
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,1)],{type:'application/json'}));a.download=`realbt-backup-${new Date().toISOString().slice(0,10)}.json`;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);toast('백업 파일을 저장했어요','ok')}catch(e){fail(e,'백업 실패')}}
async function restore(file){
 try{const d=JSON.parse(await file.text());if(d.app!=='REALBT'||!Array.isArray(d.songs))throw new Error('REALBT 백업 파일이 아닙니다');
  const uid=S.user.id;const mine=d.songs.filter(s=>(s.audio_path||'').startsWith(uid+'/'));const skipped=d.songs.length-mine.length;
  if(!await confirmBox(`곡 ${mine.length}개와 플레이리스트 ${d.playlists?.length||0}개를 복원할까요?${skipped?` (다른 계정 파일 ${skipped}개 제외)`:''}`,'복원'))return;
  const ids=new Set(mine.map(s=>s.id));
  const chunks=(a,n=400)=>{const o=[];for(let i=0;i<a.length;i+=n)o.push(a.slice(i,i+n));return o};
  const up=async(t,rows,conf)=>{for(const c of chunks(rows))await dbq(sb.from(t).upsert(c,{onConflict:conf||'id'}))};
  await up('songs',mine.map(s=>({...s,user_id:uid})),'id');
  const pls=(d.playlists||[]).map(p=>({...p,user_id:uid}));await up('playlists',pls,'id');const pid=new Set(pls.map(p=>p.id));
  await up('playlist_songs',(d.playlist_songs||[]).filter(r=>pid.has(r.playlist_id)&&ids.has(r.song_id)),'id');
  await up('favorites',(d.favorites||[]).filter(r=>ids.has(r.song_id)).map(r=>({user_id:uid,song_id:r.song_id,created_at:r.created_at})),'user_id,song_id');
  await up('listening_history',(d.listening_history||[]).filter(r=>ids.has(r.song_id)).map(r=>({...r,user_id:uid})),'id');
  await reloadData(true);toast('복원을 완료했어요','ok')}catch(e){fail(e,'복원 실패')}}

<script>
/* 핀치/더블탭/Ctrl+휠 확대 차단 */
(function(){const stop=e=>e.preventDefault();
['gesturestart','gesturechange','gestureend'].forEach(n=>document.addEventListener(n,stop,{passive:false}));
document.addEventListener('touchmove',e=>{if(e.touches&&e.touches.length>1||(e.scale&&e.scale!==1))e.preventDefault()},{passive:false});
let lt=0;document.addEventListener('touchend',e=>{const n=Date.now();if(n-lt<300&&!e.target.closest('input,textarea,select'))e.preventDefault();lt=n},{passive:false});
document.addEventListener('wheel',e=>{if(e.ctrlKey)e.preventDefault()},{passive:false});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&['+','-','=','0'].includes(e.key))e.preventDefault()});
/* 가로 스크롤 위치 고정 */
const fix=()=>{if(window.scrollX)window.scrollTo(0,window.scrollY);const m=document.getElementById('main');if(m&&m.scrollLeft)m.scrollLeft=0};
window.addEventListener('scroll',fix,{passive:true});document.addEventListener('scroll',e=>{if(e.target&&e.target.id==='main')fix()},true);
})();
</script>
<script>
/* 스크롤할 내용이 없는 화면에서도 상하로 부드럽게 늘어났다 돌아오는 탄성 효과 */
(function(){
 const SEL='#main,.modal,#qp .ql';let el=null,y0=0,pulling=false,wt=0;
 const noScroll=t=>t.scrollHeight<=t.clientHeight+1;
 const rub=d=>Math.sign(d)*Math.min(90,Math.abs(d)*.4);
 const back=t=>{t.style.transition='transform .4s cubic-bezier(.2,.8,.2,1)';t.style.transform=''};
 document.addEventListener('touchstart',e=>{
  const t=e.target.closest(SEL);if(!t||e.touches.length!==1||e.target.closest('input,textarea,select,.rg')){el=null;return}
  el=t;y0=e.touches[0].clientY;pulling=false},{passive:true});
 document.addEventListener('touchmove',e=>{
  if(!el||e.touches.length!==1)return;
  if(!noScroll(el))return;
  const d=e.touches[0].clientY-y0;if(Math.abs(d)<4&&!pulling)return;
  pulling=true;el.style.transition='none';el.style.transform='translateY('+rub(d)+'px)';
  if(e.cancelable)e.preventDefault()},{passive:false});
 const end=()=>{if(el&&pulling)back(el);el=null;pulling=false};
 document.addEventListener('touchend',end,{passive:true});document.addEventListener('touchcancel',end,{passive:true});
 document.addEventListener('wheel',e=>{
  const t=e.target.closest&&e.target.closest(SEL);if(!t||e.ctrlKey||!noScroll(t))return;
  t.style.transition='transform .12s ease-out';t.style.transform='translateY('+(-Math.sign(e.deltaY)*Math.min(12,Math.abs(e.deltaY)*.25))+'px)';
  clearTimeout(wt);wt=setTimeout(()=>back(t),120)},{passive:true});
})();
</script>
